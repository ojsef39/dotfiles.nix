name: "Nix Configuration Validation"
# TODO: maybe use determinate CI instead? https://github.com/DeterminateSystems/ci
on:
  push:
    branches:
      - "main"
  pull_request:
    branches:
      - "main"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-check:
    name: GitGuardian Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
      - name: GitGuardian scan
        uses: GitGuardian/ggshield/actions/secret@1d8cc0bbbd1ad6a7a8fcc9968504bbca01b6706b # v1.47.0
        env:
          GITHUB_PUSH_BEFORE_SHA: ${{ github.event.before }}
          GITHUB_PUSH_BASE_SHA: ${{ github.event.base }}
          GITHUB_PULL_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GITHUB_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GITGUARDIAN_API_KEY: ${{ secrets.GITGUARDIAN_API_KEY }}

  lint:
    name: Statix Lint
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@v3.15.2
      - uses: DeterminateSystems/magic-nix-cache-action@main
        with:
          use-flakehub: false

      - name: Install Just
        uses: extractions/setup-just@v3
        with:
          just-version: "1.40.0"

      - name: Run statix linter
        run: |
          echo "Linting Flake..."
          if just lint; then
            echo "success=true" >> $GITHUB_ENV
          else
            echo "Lint failed, listing flake.lock for debugging:"
            cat flake.lock
            echo "success=false" >> $GITHUB_ENV
            exit 1
          fi

  test-configurations:
    name: Test Nix Configurations
    needs: [security-check, lint]
    runs-on: ${{ matrix.os }}
    permissions:
      id-token: write
      contents: read
    strategy:
      matrix:
        # os: [ubuntu-latest, macos-latest]
        os: [macos-latest]
        include:
          - os: macos-latest
            nix_cmd: "darwin"
            nix_host: "mac"
            # - os: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@v3.15.2
        with:
          extra-conf: |
            extra-experimental-features = nix-command flakes external-builders
            extra-substituters = https://ojsef39.cachix.org
            extra-trusted-substituters = https://ojsef39.cachix.org
            extra-trusted-public-keys = ojsef39.cachix.org-1:Pe8zOhPVMt4fa/2HYlquHkTnGX3EH7lC9xMyCA2zM3Y=

      - uses: DeterminateSystems/magic-nix-cache-action@main
        with:
          use-flakehub: false

      - name: Configure Determinate Linux Builder
        run: |
          sudo mkdir -p /etc/determinate
          echo '{"builder":{"state":"enabled","cpuCount":2,"memoryBytes":4294967296}}' | sudo tee /etc/determinate/config.json
          sudo launchctl kickstart -k system/systems.determinate.nix-daemon
          sleep 2

      - name: Install Just
        uses: extractions/setup-just@v3

      - name: Debug netrc BEFORE Cachix
        run: |
          echo "== Nix configuration files =="
          cat /etc/nix/nix.conf 2>/dev/null || echo "No nix.conf found"
          cat /etc/nix/nix.custom.conf 2>/dev/null || echo "No nix.custom.conf found"
          echo "=== netrc-file config in nix.conf ==="
          grep netrc /etc/nix/nix.conf || echo "No netrc config found"
          echo ""
          echo "=== /nix/var/determinate/netrc ==="
          ls -la /nix/var/determinate/netrc 2>/dev/null && cat /nix/var/determinate/netrc || echo "File does not exist"
          echo ""
          echo "=== /etc/nix/netrc ==="
          ls -la /etc/nix/netrc 2>/dev/null && cat /etc/nix/netrc || echo "File does not exist"
          echo ""
          echo "=== ~/.netrc ==="
          ls -la ~/.netrc 2>/dev/null && cat ~/.netrc || echo "File does not exist"
          echo "== Cachix doctor output =="
          nix run nixpkgs#cachix -- doctor

      - name: Setup Cachix Auth
        uses: cachix/cachix-action@v16
        with:
          name: ojsef39
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"

      - name: Debug netrc AFTER Cachix
        run: |
          echo "== Nix configuration files =="
          cat /etc/nix/nix.conf 2>/dev/null || echo "No nix.conf found"
          cat /etc/nix/nix.custom.conf 2>/dev/null || echo "No nix.custom.conf found"
          echo "=== netrc-file config in nix.conf ==="
          grep netrc /etc/nix/nix.conf || echo "No netrc config found"
          echo ""
          echo "=== /nix/var/determinate/netrc ==="
          ls -la /nix/var/determinate/netrc 2>/dev/null && cat /nix/var/determinate/netrc || echo "File does not exist"
          echo ""
          echo "=== /etc/nix/netrc ==="
          ls -la /etc/nix/netrc 2>/dev/null && cat /etc/nix/netrc || echo "File does not exist"
          echo ""
          echo "=== ~/.netrc ==="
          ls -la ~/.netrc 2>/dev/null && cat ~/.netrc || echo "File does not exist"
          echo "== Cachix doctor output =="
          nix run nixpkgs#cachix -- doctor

      - uses: DeterminateSystems/flake-checker-action@main
      - run: nix flake check

      - name: Check Configuration
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
        run: |
          nix run nixpkgs#nh -- ${{ matrix.nix_cmd }} build --no-nom -H ${{ matrix.nix_host }} .
