#NOTE: looks interesting https://github.com/DeterminateSystems/ci
name: "Nix Configuration Validation"
on:
  push:
    branches:
      - "main"
  pull_request:
    branches:
      - "main"
  schedule:
    # Daily CVE scan; 04:00 UTC = 05:00 CET / 06:00 CEST
    - cron: "0 4 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-check:
    name: GitGuardian Security Scan
    # Nothing new to scan on scheduled runs
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: GitGuardian scan
        uses: GitGuardian/ggshield/actions/secret@4cccd600fd3890a7aba07fd0a45e483f3099fe70 # v1.56.1
        env:
          GITHUB_PUSH_BEFORE_SHA: ${{ github.event.before }}
          GITHUB_PUSH_BASE_SHA: ${{ github.event.base }}
          GITHUB_PULL_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GITHUB_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GITGUARDIAN_API_KEY: ${{ secrets.GITGUARDIAN_API_KEY }}

  lint:
    name: Statix Lint
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@v3.24.1
      - uses: DeterminateSystems/magic-nix-cache-action@main
        with:
          use-flakehub: false

      - name: Re-authenticate with FlakeHub token
        run: |
          echo "${{ secrets.FLAKEHUB_TOKEN }}" | determinate-nixd auth login token --token-file /dev/stdin

      - name: Install Just
        uses: extractions/setup-just@v4
        with:
          just-version: "1.59.0"

      - name: Run statix linter
        run: |
          echo "Linting Flake..."
          if just lint; then
            echo "success=true" >> $GITHUB_ENV
          else
            echo "Lint failed, listing flake.lock for debugging:"
            cat flake.lock
            echo "success=false" >> $GITHUB_ENV
            exit 1
          fi

  test-configurations:
    name: Test Nix Configurations
    needs: [security-check, lint]
    # Still run when security-check is skipped (scheduled runs)
    if: ${{ !cancelled() && !failure() }}
    runs-on: ${{ matrix.os }}
    permissions:
      id-token: write
      contents: read
      security-events: write
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        include:
          - os: macos-latest
            nix_cmd: "darwin"
            nix_host: "JosefsMacBookPro-ci"
            config_attr: "darwinConfigurations"
            settings_path: "config.determinateNix.customSettings"
          - os: ubuntu-latest
            nix_cmd: "os"
            nix_host: "josef-nd1-gpu0"
            config_attr: "nixosConfigurations"
            settings_path: "config.nix.settings"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # If more space is needed, see https://github.com/jlumbroso/free-disk-space/issues/23
      - name: Free disk space
        if: matrix.os == 'ubuntu-latest'
        uses: jlumbroso/free-disk-space@ceedf095f4ec1a097402bc6bd80831f2e1a6fde6 # v2.0.0

      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@v3.24.1
        with:
          extra-conf: |
            extra-experimental-features = nix-command flakes external-builders
            substituters = https://cache.nixos.org https://ojsef39.cachix.org https://nvf.cachix.org https://nix-community.cachix.org
            trusted-substituters = https://cache.nixos.org https://ojsef39.cachix.org https://nvf.cachix.org https://nix-community.cachix.org
            trusted-public-keys = cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY= ojsef39.cachix.org-1:Pe8zOhPVMt4fa/2HYlquHkTnGX3EH7lC9xMyCA2zM3Y= nvf.cachix.org-1:GMQWiUhZ6ux9D5CvFFMwnc2nFrUHTeGaXRlVBXo+naI= nix-community.cachix.org-1:mB9FSh9qf2dCimDSUo8Zy7bkq5CX+/rkCWyvRCYg3Fs=

      - name: Re-authenticate with FlakeHub token
        run: |
          echo "${{ secrets.FLAKEHUB_TOKEN }}" | determinate-nixd auth login token --token-file /dev/stdin

      - name: Install Just
        uses: extractions/setup-just@v4

      - name: Setup Cachix Auth
        uses: cachix/cachix-action@v17
        with:
          name: ojsef39
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"

      - uses: DeterminateSystems/flake-checker-action@main
      - run: nix flake check

      - name: Check Configuration
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
        run: |
          # Derive substituters/keys from the host config itself so this pipeline
          # never drifts from the caches declared in the dotfiles
          attr=".#${{ matrix.config_attr }}.${{ matrix.nix_host }}.${{ matrix.settings_path }}"
          subs=$(nix eval --raw "$attr.extra-substituters" --apply 'builtins.concatStringsSep " "')
          keys=$(nix eval --raw "$attr.extra-trusted-public-keys" --apply 'builtins.concatStringsSep " "')
          export NIX_CONFIG="extra-substituters = $subs
          extra-trusted-substituters = $subs
          extra-trusted-public-keys = $keys"
          nix run nixpkgs#nh -- ${{ matrix.nix_cmd }} build -L --no-nom -H ${{ matrix.nix_host }} -o result-system .

      # Only the vulnix NVD cache is worth keeping (Grype DB is ~3 GB and changes daily).
      # Saved only outside PRs so Renovate branches don't each store a copy.
      - name: Restore vulnix cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/vulnix
          key: vulnix-${{ runner.os }}-${{ github.run_id }}
          restore-keys: vulnix-${{ runner.os }}-

      - name: CVE scan
        run: |
          nix run github:tiiuae/sbomnix/v1.9.0#vulnxscan -- \
            --format sarif --sarif-location flake.lock --out vulns.sarif ./result-system \
            2> vulnxscan.log || { cat vulnxscan.log >&2; exit 1; }
          cat vulnxscan.log >&2
          # vulnxscan only logs a failed vulnix run (its argv shows up as ['vulnix', ...])
          # and carries on with Grype/OSV, which would upload an incomplete report.
          if grep -qF "['vulnix'" vulnxscan.log; then
            echo "::error::vulnix failed, refusing to upload an incomplete CVE report"
            exit 1
          fi
          echo "CVE findings: $(jq '.runs[0].results | length' vulns.sarif)" >> "$GITHUB_STEP_SUMMARY"

      # Code scanning only blocks a PR on alerts inside its diff, and every finding
      # sits on flake.lock, so a .nix-only change would slip through. Instead compare
      # against the last main/scheduled scan: new high/critical findings fail the job.
      - name: Restore CVE baseline
        if: github.event_name == 'pull_request'
        uses: actions/cache/restore@v4
        with:
          path: vulns-baseline.sarif
          key: vulnxscan-baseline-${{ matrix.nix_host }}-${{ github.run_id }}
          restore-keys: vulnxscan-baseline-${{ matrix.nix_host }}-

      - name: Fail on new high/critical CVEs
        if: github.event_name == 'pull_request'
        run: |
          if [[ ! -f vulns-baseline.sarif ]]; then
            echo "::warning::No CVE baseline from main yet, skipping new-finding check"
            exit 0
          fi
          nix run github:tiiuae/sbomnix/v1.9.0#vulnxscan-diff -- \
            --previous vulns-baseline.sarif --current vulns.sarif --markdown diff.md --max-chars 60000
          cat diff.md >> "$GITHUB_STEP_SUMMARY"
          # vulnxscan/package-v1 = CVE + package, ignoring version, so a version bump
          # of an already-known finding does not count as new
          new=$(jq -r --slurpfile base vulns-baseline.sarif '
            [$base[0].runs[].results[].partialFingerprints["vulnxscan/package-v1"]] as $known
            | .runs[].results[]
            | select(.level == "error")
            | select(.partialFingerprints["vulnxscan/package-v1"] as $k | $known | index($k) | not)
            | .message.text' vulns.sarif)
          if [[ -n "$new" ]]; then
            echo "::error::New high/critical CVEs compared to main:"
            echo "$new"
            exit 1
          fi

      - name: Save CVE baseline
        if: github.event_name != 'pull_request'
        run: cp vulns.sarif vulns-baseline.sarif

      - name: Upload CVE baseline cache
        if: github.event_name != 'pull_request'
        uses: actions/cache/save@v4
        with:
          path: vulns-baseline.sarif
          key: vulnxscan-baseline-${{ matrix.nix_host }}-${{ github.run_id }}

      - name: Save vulnix cache
        if: github.event_name != 'pull_request'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/vulnix
          key: vulnix-${{ runner.os }}-${{ github.run_id }}

      - name: Upload CVE results to code scanning
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: vulns.sarif
          category: vulnxscan-${{ matrix.nix_host }}
