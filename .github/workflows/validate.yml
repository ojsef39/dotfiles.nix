#NOTE: looks interesting https://github.com/DeterminateSystems/ci
name: "Nix Configuration Validation"
on:
  push:
    branches:
      - "main"
  pull_request:
    branches:
      - "main"
  schedule:
    # Daily CVE scan; 04:00 UTC = 05:00 CET / 06:00 CEST
    - cron: "0 4 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-check:
    name: GitGuardian Security Scan
    # Nothing new to scan on scheduled runs
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: GitGuardian scan
        uses: GitGuardian/ggshield/actions/secret@4cccd600fd3890a7aba07fd0a45e483f3099fe70 # v1.56.1
        env:
          GITHUB_PUSH_BEFORE_SHA: ${{ github.event.before }}
          GITHUB_PUSH_BASE_SHA: ${{ github.event.base }}
          GITHUB_PULL_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GITHUB_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GITGUARDIAN_API_KEY: ${{ secrets.GITGUARDIAN_API_KEY }}

  lint:
    name: Statix Lint
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@v3.24.1
      - uses: DeterminateSystems/magic-nix-cache-action@main
        with:
          use-flakehub: false

      - name: Re-authenticate with FlakeHub token
        run: |
          echo "${{ secrets.FLAKEHUB_TOKEN }}" | determinate-nixd auth login token --token-file /dev/stdin

      - name: Install Just
        uses: extractions/setup-just@v4
        with:
          just-version: "1.59.0"

      - name: Run statix linter
        run: |
          echo "Linting Flake..."
          if just lint; then
            echo "success=true" >> $GITHUB_ENV
          else
            echo "Lint failed, listing flake.lock for debugging:"
            cat flake.lock
            echo "success=false" >> $GITHUB_ENV
            exit 1
          fi

  test-configurations:
    name: Test Nix Configurations
    needs: [security-check, lint]
    runs-on: ${{ matrix.os }}
    permissions:
      id-token: write
      contents: read
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        include:
          - os: macos-latest
            nix_cmd: "darwin"
            nix_host: "JosefsMacBookPro-ci"
            config_attr: "darwinConfigurations"
            settings_path: "config.determinateNix.customSettings"
          - os: ubuntu-latest
            nix_cmd: "os"
            nix_host: "josef-nd1-gpu0"
            config_attr: "nixosConfigurations"
            settings_path: "config.nix.settings"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # If more space is needed, see https://github.com/jlumbroso/free-disk-space/issues/23
      - name: Free disk space
        if: matrix.os == 'ubuntu-latest'
        uses: jlumbroso/free-disk-space@ceedf095f4ec1a097402bc6bd80831f2e1a6fde6 # v2.0.0

      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@v3.24.1
        with:
          extra-conf: |
            extra-experimental-features = nix-command flakes external-builders
            substituters = https://cache.nixos.org https://ojsef39.cachix.org https://nvf.cachix.org https://nix-community.cachix.org
            trusted-substituters = https://cache.nixos.org https://ojsef39.cachix.org https://nvf.cachix.org https://nix-community.cachix.org
            trusted-public-keys = cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY= ojsef39.cachix.org-1:Pe8zOhPVMt4fa/2HYlquHkTnGX3EH7lC9xMyCA2zM3Y= nvf.cachix.org-1:GMQWiUhZ6ux9D5CvFFMwnc2nFrUHTeGaXRlVBXo+naI= nix-community.cachix.org-1:mB9FSh9qf2dCimDSUo8Zy7bkq5CX+/rkCWyvRCYg3Fs=

      - name: Re-authenticate with FlakeHub token
        run: |
          echo "${{ secrets.FLAKEHUB_TOKEN }}" | determinate-nixd auth login token --token-file /dev/stdin

      - name: Install Just
        uses: extractions/setup-just@v4

      - name: Setup Cachix Auth
        uses: cachix/cachix-action@v17
        with:
          name: ojsef39
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"

      - uses: DeterminateSystems/flake-checker-action@main
      - run: nix flake check

      - name: Check Configuration
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
        run: |
          # Derive substituters/keys from the host config itself so this pipeline
          # never drifts from the caches declared in the dotfiles
          attr=".#${{ matrix.config_attr }}.${{ matrix.nix_host }}.${{ matrix.settings_path }}"
          subs=$(nix eval --raw "$attr.extra-substituters" --apply 'builtins.concatStringsSep " "')
          keys=$(nix eval --raw "$attr.extra-trusted-public-keys" --apply 'builtins.concatStringsSep " "')
          export NIX_CONFIG="extra-substituters = $subs
          extra-trusted-substituters = $subs
          extra-trusted-public-keys = $keys"
          nix run nixpkgs#nh -- ${{ matrix.nix_cmd }} build -L --no-nom -H ${{ matrix.nix_host }} .


  # Evaluation-only (build-time closure), so it needs no build and runs in parallel
  # with test-configurations. Darwin evaluates fine on Linux (no IFD).
  cve-scan:
    name: CVE Scan (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      # flakevuln clones the repo; skip LFS like Nix does (also a missing LFS object breaks it)
      GIT_LFS_SKIP_SMUDGE: "1"
    permissions:
      contents: read
      actions: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: nixos
            target: nixosConfigurations.josef-nd1-gpu0.config.system.build.toplevel
          - name: darwin
            target: darwinConfigurations.JosefsMacBookPro-ci.system
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Scan with flakevuln
        id: flakevuln
        uses: tiiuae/flakevuln@680ffb867974ea6539be4a1509c8f7a7be262df8
        with:
          targets: ${{ matrix.target }}
          sarif-location: flake.lock
          strict-scanner: true

      - name: Upload CVE results to code scanning
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: ${{ steps.flakevuln.outputs.sarif }}
          category: flakevuln-${{ matrix.name }}

      # Code scanning only blocks a PR on alerts inside its diff, and every finding
      # sits on flake.lock, so a .nix-only change would slip through. Instead treat
      # main's alerts (open or dismissed in the Security tab) as known and fail on
      # PR alerts beyond them. Keyed on CVE + package, ignoring version, so a version
      # bump of a known finding passes but an extra concurrent version does not.
      - name: Fail on new high/critical CVEs
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          CATEGORY: flakevuln-${{ matrix.name }}
          PR_REF: refs/pull/${{ github.event.pull_request.number }}/merge
        run: |
          alerts() {
            gh api --paginate "repos/$GITHUB_REPOSITORY/code-scanning/alerts?ref=$1&per_page=100" --jq '.[]' |
              jq -s --arg cat "$CATEGORY" '[.[] | select(.most_recent_instance.category == $cat)
                | .key = .rule.id + " " + (.most_recent_instance.message.text | capture("affects (?<p>\\S+)").p)]'
          }
          main_runs=$(gh api "repos/$GITHUB_REPOSITORY/code-scanning/analyses?ref=refs/heads/main&per_page=100" \
            --jq "[.[] | select(.category == \"$CATEGORY\")] | length")
          if [[ "$main_runs" == 0 ]]; then
            echo "::warning::No $CATEGORY scan on main yet, skipping new-finding check"
            exit 0
          fi
          alerts refs/heads/main > main.json
          alerts "$PR_REF" > pr.json
          new=$(jq -r --slurpfile main main.json '
            (reduce ($main[0][] | select(.state == "open" or .state == "dismissed") | .key) as $k
              ({}; .[$k] += 1)) as $known
            | [.[] | select(.state == "open" and (.rule.security_severity_level | IN("high", "critical")))]
            | group_by(.key)[]
            | .[($known[.[0].key] // 0):][]
            | "\(.html_url) \(.most_recent_instance.message.text)"' pr.json)
          if [[ -n "$new" ]]; then
            echo "::error::New high/critical CVEs compared to main (dismiss them in the Security tab if they don't apply):"
            echo "$new"
            exit 1
          fi
